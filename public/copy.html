<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gyors WebP Konvertáló (Batch)</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #eef2f7;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            width: 450px;
        }
        .drop-zone {
            border: 2px dashed #007bff;
            padding: 30px;
            border-radius: 10px;
            background: #f8fbff;
            cursor: pointer;
            transition: 0.3s;
        }
        .drop-zone:hover { background: #e1efff; }
        h1 { color: #2c3e50; font-size: 1.4rem; margin-bottom: 20px; }
        #status {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #555;
            max-height: 200px;
            overflow-y: auto;
            text-align: left;
            padding: 10px;
            background: #f9f9f9;
            border-radius: 5px;
        }
        .progress-bar {
            height: 10px;
            width: 0%;
            background: #28a745;
            border-radius: 5px;
            margin-top: 10px;
            transition: width 0.3s;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>WebP Tömeges Konvertáló</h1>
    
    <div class="drop-zone" onclick="document.getElementById('upload').click()">
        Kattints ide vagy húzd ide a képeket!<br>
        <small>(JPG, PNG támogatott)</small>
    </div>
    
    <input type="file" id="upload" accept="image/jpeg, image/png" multiple style="display: none;">
    
    <div id="progressCont" style="display:none;">
        <div class="progress-bar" id="progressBar"></div>
    </div>
    
    <div id="status">Várakozás fájlokra...</div>
</div>

<canvas id="canvas" style="display:none;"></canvas>

<script>
    const upload = document.getElementById('upload');
    const status = document.getElementById('status');
    const progressBar = document.getElementById('progressBar');
    const progressCont = document.getElementById('progressCont');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    upload.addEventListener('change', async (event) => {
        const files = Array.from(event.target.files);
        if (files.length === 0) return;

        status.innerHTML = "<b>Folyamat elindítva...</b><br>";
        progressCont.style.display = 'block';
        let processed = 0;

        for (const file of files) {
            try {
                await processFile(file);
                processed++;
                let percent = (processed / files.length) * 100;
                progressBar.style.width = percent + "%";
                status.innerHTML += `✅ ${file.name} kész.<br>`;
                status.scrollTop = status.scrollHeight;
            } catch (err) {
                status.innerHTML += `❌ Hiba: ${file.name}<br>`;
            }
        }
        status.innerHTML += "<b><br>Összes fájl feldolgozva!</b>";
    });

    function processFile(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);
                    
                    // WebP formátum generálása (minőség: 0.8)
                    canvas.toBlob((blob) => {
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        // Az eredeti kiterjesztés levágása és .webp hozzáadása
                        a.download = file.name.replace(/\.[^/.]+$/, "") + ".webp";
                        document.body.appendChild(a);
                        a.click(); // Automatikus letöltés indítása
                        document.body.removeChild(a);
                        URL.revokeObjectURL(url);
                        resolve();
                    }, 'image/webp', 0.8);
                };
                img.onerror = reject;
                img.src = e.target.result;
            };
            reader.onerror = reject;
            reader.readAsDataURL(file);
        });
    }
</script>

</body>
</html>
